<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>English Idiom Test – hard pass</title>
<style>
  * { box-sizing: border-box; }

  body {
    background-color: #0f0f0f;
    color: #f0f0f0;
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    margin: 0;
    padding: 16px;
  }

  main { max-width: 720px; width: 100%; padding: 8px; }

  h1 {
    font-size: clamp(20px, 5vw, 28px);
    line-height: 1.3;
    margin-bottom: 20px;
    color: #f0f0f0;
  }

  ul.options { list-style: none; padding: 0; margin: 0 0 20px 0; }

  .option {
    border: 2px solid #8c8c8c;
    border-radius: 8px;
    padding: 14px 16px;
    font-size: clamp(16px, 4vw, 20px);
    line-height: 1.4;
    color: #e6e6e6;
    margin-bottom: 12px;
    background: transparent;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: all 0.3s ease;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .option:hover { background-color: #1a1a1a; border-color: #a0a0a0; }
  .option:active { transform: scale(0.98); }
  .option:focus { outline: 2px solid #2da543; outline-offset: 2px; }

  .option-text { flex: 1; min-width: 0; }

  .icon { width: 24px; height: 24px; min-width: 24px; flex-shrink: 0; display: none; }

  .option.correct { border-color: #2da543 !important; background-color: rgba(45,165,67,0.1); }
  .option.correct .blank { color: #2da543; font-weight: 600; }
  .option.correct .icon { display: inline-block; }

  .option.wrong { border-color: #e78b89 !important; background-color: rgba(231,139,137,0.1); }
  .option.wrong .blank { color: #e78b89; font-weight: 600; }
  .option.wrong .icon { display: inline-block; }

  .option.disabled { cursor: not-allowed; pointer-events: none; }

  .blank {
    display: inline-block;
    min-width: 100px;
    border-bottom: 2px solid #8c8c8c;
    text-align: center;
    vertical-align: baseline;
    padding: 0 4px;
  }
  .blank.filled { border-bottom: none; }

  .explanation {
    background-color: #262626;
    border-radius: 8px;
    padding: 16px;
    display: none;
    margin-bottom: 16px;
    animation: fadeIn 0.4s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .explanation h2 {
    margin-top: 0; margin-bottom: 12px; font-weight: bold;
    font-size: clamp(18px, 4vw, 22px); color: #ffffff;
  }
  .explanation p { margin: 0; color: #f0f0f0; line-height: 1.5; font-size: clamp(14px,3.5vw,16px); }

  button.reset {
    margin-top: 8px; padding: 12px 24px; width: 100%; max-width: 200px;
    background-color: #0f0f0f; border: 2px solid #8c8c8c; border-radius: 8px;
    color: #ffffff; font-size: 16px; font-weight: 500; cursor: pointer; transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  button.reset:hover { background-color: #262626; border-color: #a0a0a0; }
  button.reset:active { transform: scale(0.96); }

  @media (max-width:480px){
    body { padding: 12px; } main { padding: 4px; }
    .option { padding: 12px 14px; margin-bottom: 10px; }
    .icon { width: 20px; height: 20px; min-width: 20px; }
    .explanation { padding: 14px; }
    button.reset { max-width: 100%; }
  }
  @media (min-width:768px){ body { padding: 32px } main { padding: 16px } }
</style>
</head>
<body>
<main>
  <h1>Выберите единственное предложение, где выражение 'hard pass' уместно.</h1>

  <ul class="options" id="options">
    <li class="option" data-correct="true"
        data-expl="Правильно! Идиома 'hard pass' означает твердый, категорический отказ от какого-либо предложения. В данном случае человек наотрез отказывается бесплатно работать по выходным.">
      <span class="option-text">When they asked me to work over the weekend for no extra pay, it was a <span class="blank" aria-hidden="true"></span>.</span>
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="#2da543" stroke-width="2" fill="none"/>
        <path d="M6 12l4 4 8-8" stroke="#ffffff" stroke-width="2" fill="none"/>
      </svg>
    </li>

    <li class="option" data-correct="false"
        data-expl="Неверно. Здесь слово 'pass' используется в буквальном значении (сдать экзамен). Однако устойчивое выражение 'hard pass' означает решительный отказ, а не успешную сдачу сложного теста.">
      <span class="option-text">I studied all night to get a <span class="blank" aria-hidden="true"></span> on my final exam.</span>
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="#e78b89" stroke-width="2" fill="none"/>
        <line x1="8" y1="8" x2="16" y2="16" stroke="#ffffff" stroke-width="2"/>
        <line x1="16" y1="8" x2="8" y2="16" stroke="#ffffff" stroke-width="2"/>
      </svg>
    </li>

    <li class="option" data-correct="false"
        data-expl="Неверно. В данном контексте сочетание слов не имеет логического смысла и не соответствует значению идиомы (категорический отказ).">
      <span class="option-text">He went to the supermarket to buy a <span class="blank" aria-hidden="true"></span>.</span>
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10" stroke="#e78b89" stroke-width="2" fill="none"/>
        <line x1="8" y1="8" x2="16" y2="16" stroke="#ffffff" stroke-width="2"/>
        <line x1="16" y1="8" x2="8" y2="16" stroke="#ffffff" stroke-width="2"/>
      </svg>
    </li>
  </ul>

  <section class="explanation" aria-live="polite">
    <h2>Пояснение</h2>
    <p></p>
  </section>

  <button class="reset" id="resetBtn">Сбросить</button>
</main>

<script>
  const optionsList = document.getElementById('options');
  const explanation = document.querySelector('.explanation');
  const explanationText = explanation.querySelector('p');
  const resetBtn = document.getElementById('resetBtn');
  const expression = "hard pass";

  let answered = false;

  // Сохраняем исходный массив элементов один раз при загрузке
  const originalOptions = Array.from(optionsList.querySelectorAll('.option'));

  // Алгоритм Тасования Фишера-Йетса
  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function renderOptions() {
    answered = false;
    explanation.style.display = 'none';
    explanationText.textContent = '';

    // Перемешиваем оригинальный массив элементов
    shuffleArray(originalOptions);

    // Очищаем контейнер и наполняем его заново сброшенными элементами
    optionsList.innerHTML = '';
    originalOptions.forEach((opt) => {
      opt.classList.remove('correct', 'wrong', 'disabled');
      opt.setAttribute('tabindex', '0');
      opt.setAttribute('role', 'button');

      const blank = opt.querySelector('.blank');
      blank.textContent = '';
      blank.classList.remove('filled');
      blank.setAttribute('aria-hidden', 'true'); // Скрываем пустой пропуск от скринридеров

      const icon = opt.querySelector('.icon');
      if (icon) icon.style.display = 'none';

      optionsList.appendChild(opt);
    });
  }

  function selectOption(selectedOpt) {
    if (answered) return;
    answered = true;

    const isCorrect = selectedOpt.dataset.correct === "true";
    const blank = selectedOpt.querySelector('.blank');
    blank.textContent = expression;
    blank.classList.add('filled');
    blank.removeAttribute('aria-hidden'); // Делаем вставленный текст доступным для скринридеров

    if (isCorrect) {
      selectedOpt.classList.add('correct');
    } else {
      selectedOpt.classList.add('wrong');
    }

    const icon = selectedOpt.querySelector('.icon');
    if (icon) icon.style.display = 'inline-block';

    // Блокируем все варианты и убираем их из фокуса клавиатуры
    const allOptions = optionsList.querySelectorAll('.option');
    allOptions.forEach(opt => {
      opt.classList.add('disabled');
      opt.setAttribute('tabindex', '-1');
    });

    // Показываем блок пояснения
    explanationText.textContent = selectedOpt.dataset.expl || '';
    explanation.style.display = 'block';
    explanation.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // --- ДЕЛЕГИРОВАНИЕ СОБЫТИЙ ---

  // Обработка кликов на варианты ответов
  optionsList.addEventListener('click', (e) => {
    const opt = e.target.closest('.option');
    if (opt && !opt.classList.contains('disabled')) {
      selectOption(opt);
    }
  });

  // Навигация с клавиатуры и выбор по Enter / Space
  optionsList.addEventListener('keydown', (e) => {
    const opt = e.target.closest('.option');
    if (!opt || opt.classList.contains('disabled')) return;

    const allOptions = Array.from(optionsList.querySelectorAll('.option'));
    const idx = allOptions.indexOf(opt);

    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      selectOption(opt);
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      const next = allOptions[(idx + 1) % allOptions.length];
      next.focus();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      const prev = allOptions[(idx - 1 + allOptions.length) % allOptions.length];
      prev.focus();
    }
  });

  resetBtn.addEventListener('click', renderOptions);

  // Первый запуск
  renderOptions();
</script>
</body>
</html>
